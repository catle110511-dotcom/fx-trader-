name: 실제 환율 갱신

on:
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다 (환율 출처는 하루 1번 바뀜)
  workflow_dispatch:          # Actions 탭에서 직접 실행도 가능

permissions:
  contents: write

concurrency:
  group: update-fx
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 환율 받기
        run: python scripts/update_fx.py
      - name: 바뀐 게 있으면 저장
        run: |
          if git diff --quiet -- live.js; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add live.js
          git commit -m "환율 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
